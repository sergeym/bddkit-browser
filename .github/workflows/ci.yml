name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned on purpose: a floating stable's new clippy lint must never
      # redden a PR that has nothing to do with it.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
          rustflags: ""
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked --lib --test stub

  e2e-chrome:
    name: e2e against a Chrome container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          rustflags: ""
      # The host comes from crates.io at a pinned version, never a floating
      # branch: a red run here must mean this plugin broke. 0.2.0 is the
      # first release that reads `fields` and resolves `bddkit_probe_config`.
      - name: Install bddkit
        run: cargo install bddkit --version 0.2.0 --locked
      - name: Start Chrome
        run: docker compose up -d --wait
      - name: End-to-end
        run: cargo test --locked --test e2e -- --test-threads=1
