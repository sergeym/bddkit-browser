<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in — bddkit demo</title></head>
<body>
<h1>Sign in</h1>
<p id="error" hidden>Wrong e-mail or password</p>
<form method="post" action="/login">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" placeholder="you@example.test">
  <label for="password">Password</label>
  <input id="password" name="password" type="password">
  <button type="submit">Sign in</button>
</form>
<p>Any e-mail with the password <code>secret</code> signs in.</p>
<script>
  if (new URLSearchParams(location.search).get('error')) {
    document.getElementById('error').hidden = false;
  }
</script>
</body>
</html>
