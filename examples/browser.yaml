# The demo suite: a browser in a Selenium container drives the site from
# `cargo run --example site`, and the host's own HTTP steps read its API.
paths: [examples/features]
concurrency: 1
resources:
  api:
    site:
      base_url: http://localhost:3000
  browser:
    chrome:
      browser: chrome
      url: http://localhost:4444        # docker compose up -d
      base_url: http://localhost:3000   # cargo run --example site
      # headless: false                 # put this in browser.local.yaml to watch
    firefox:                            # managed mode: no url, the plugin brings the browser
      browser: firefox
      base_url: http://localhost:3000
default_browser: chrome
